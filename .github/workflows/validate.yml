name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill structure
        run: python humanities-essay/scripts/quick_validate.py humanities-essay
      - name: Test deterministic helpers
        run: python -m unittest discover -s tests -v
